 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Options</title>
    <style>

        :root {
            --primary-color: #1c0d3f; /* Dark blue */
            --secondary-color: #ed26b7; /* Pink */
            --button-hover-color: #2637ef; /* Hover blue */
            --background-color: #f5f5f5; /* Light grey background */
            --text-color: #333333; /* Dark grey text */
        }

        body {
            background-color: var(--background-color);
            font-family: 'Arial', sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
        }

        .button {
            background-color: var(--primary-color);
            border: none;
            color: white;
            padding: 15px 30px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 20px 10px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }

        .button:hover {
            background-color: var(--button-hover-color);
            color: white;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 24px;
        }

    .file-links ul {
      list-style: none;
      padding: 0;
    }

    .file-links li {
      margin: 10px 0;
    }

    .file-links a {
      color: var(--secondary-color);
      text-decoration: none;
    }

    .file-links a:hover {
      text-decoration: underline;
    }
    </style>
</head>
<body>
<div class="container">
   <h1>Select Your Dashboard</h1>
   <a href="./tournament/index.html" class="button">Tournament</a>
   <a href="./store/index.html" class="button">Store</a>
  <div class="file-links">
    <h2>Files used in this task:</h2>
    <ul>
      <li><a href="./files/generatedata.py">Python Script for generating random data</a></li>
      <li>The following files were generated, uploaded to BigQuery, and used in the 'store' section.</li>
      <li><a href="./files/SalesData.csv">SalesData.csv</a> </li>
      <li><a href="./files/ProductData.csv">ProductData.csv</a> </li>
      <li><a href="./files/CustomerData.csv">CustomerData.csv</a></li>
    </ul>
  </div>
    </div>
</body>
</html>
